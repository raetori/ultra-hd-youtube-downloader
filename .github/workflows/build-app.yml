name: Build app

on:
  push:
    branches: [main, cosmos-media-app]
    paths: ["app/**", "assets/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile (Apple Silicon + Intel)
        working-directory: app
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Make the .app
        run: bash app/bundle.sh

      - name: Smoke test (launch the app and take a screenshot)
        continue-on-error: true
        run: |
          open "dist/Cosmos Media Downloader.app"
          sleep 8
          pgrep -x CosmosMediaDownloader
          screencapture -x dist/screenshot.png
          pkill -x CosmosMediaDownloader || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: dist/screenshot.png
          if-no-files-found: ignore

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat app/VERSION)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/CosmosMediaDownloader.zip --clobber
          else
            gh release create "v$VERSION" dist/CosmosMediaDownloader.zip \
              --title "Cosmos Media Downloader $VERSION" \
              --notes "Install or update with the one-line command in the README." \
              --latest
          fi
