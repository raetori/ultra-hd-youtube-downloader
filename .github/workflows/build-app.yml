name: Build app

on:
  push:
    branches: [main, cosmos-media-app]
    paths: ["app/**", "assets/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile (Apple Silicon + Intel)
        working-directory: app
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Make the .app
        run: bash app/bundle.sh

      - name: Smoke test (launch the app and take a screenshot)
        continue-on-error: true
        run: |
          open "dist/Cosmos Media Downloader.app"
          sleep 8
          pgrep -x CosmosMediaDownloader
          screencapture -x dist/screenshot.png
          pkill -x CosmosMediaDownloader || true

      - name: End-to-end test (real downloads with the Mac's own encoder)
        continue-on-error: true
        run: |
          bash install.sh --update || true
          pkill -x CosmosMediaDownloader || true
          # Open movies from the Blender Foundation (Creative Commons): a direct H.264 file and a YouTube upload,
          # trimmed so the YouTube one has to be re-encoded.
          "dist/Cosmos Media Downloader.app/Contents/MacOS/CosmosMediaDownloader" --selftest \
            "best::https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4" \
            "hd1080:10-30:https://www.youtube.com/watch?v=aqz-KE-bpKQ" \
            "mp3:0-15:https://www.youtube.com/watch?v=aqz-KE-bpKQ" 2>&1 | tee dist/selftest.txt

      - name: Keep the screenshot on a "ci-preview" pre-release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f dist/screenshot.png ] || exit 0
          gh release view ci-preview >/dev/null 2>&1 || \
            gh release create ci-preview --prerelease --title "CI preview" --notes "Screenshots from automated test launches. Not for installing."
          gh release upload ci-preview dist/screenshot.png --clobber
          [ -f dist/selftest.txt ] && gh release upload ci-preview dist/selftest.txt --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat app/VERSION)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/CosmosMediaDownloader.zip --clobber
          else
            gh release create "v$VERSION" dist/CosmosMediaDownloader.zip \
              --title "Cosmos Media Downloader $VERSION" \
              --notes "Install or update with the one-line command in the README." \
              --latest
          fi
