name: Build app

on:
  push:
    branches: [main, "preview/**"]
    paths: ["app/**", "assets/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Compile (Apple Silicon + Intel)
        working-directory: app
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Make the .app
        run: bash app/bundle.sh

      - name: Link list import test (no network)
        run: |
          mkdir -p dist
          "dist/CosmoGrav.app/Contents/MacOS/CosmoGrav" --selftest-import 2>&1 | tee dist/selftest-import.txt

      - name: .crawljob and Folder Watch test (no network)
        run: |
          "dist/CosmoGrav.app/Contents/MacOS/CosmoGrav" --selftest-crawljob 2>&1 | tee dist/selftest-crawljob.txt

      - name: Smoke test (launch the app and take a screenshot)
        continue-on-error: true
        run: |
          open "dist/CosmoGrav.app"
          sleep 8
          pgrep -x CosmoGrav
          screencapture -x dist/screenshot.png
          pkill -x CosmoGrav || true
          sleep 2
          open "dist/CosmoGrav.app" --args --demo
          sleep 8
          screencapture -x dist/screenshot-demo.png
          pkill -9 -x CosmoGrav || true
          sleep 2
          open "dist/CosmoGrav.app" --args --about
          sleep 8
          screencapture -x dist/screenshot-about.png
          pkill -9 -x CosmoGrav || true
          sleep 2
          open "dist/CosmoGrav.app" --args --import-demo
          sleep 8
          screencapture -x dist/screenshot-import.png
          pkill -9 -x CosmoGrav || true
          sleep 2
          open "dist/CosmoGrav.app" --args --crawljob-demo
          sleep 8
          screencapture -x dist/screenshot-crawljob.png
          pkill -9 -x CosmoGrav || true

      - name: End-to-end test (real downloads with the Mac's own encoder)
        continue-on-error: true
        run: |
          bash install.sh --update || true
          pkill -x CosmoGrav || true
          # YouTube blocks cloud machines like this one ("confirm you're not a bot"), so test media is generated here and served locally:
          # a 4K VP9/Opus WebM (must be converted), an H.264/AAC MP4 (must be copied untouched) and a trimmed clip.
          F="$HOME/Library/Application Support/TeamYTDownloader/bin/ffmpeg"
          mkdir -p /tmp/media && cd /tmp/media
          "$F" -loglevel error -y -f lavfi -i testsrc2=size=3840x2160:rate=30 -f lavfi -i sine=frequency=440 -t 12 -c:v libvpx-vp9 -deadline realtime -cpu-used 8 -b:v 8M -c:a libopus vp9-4k.webm
          "$F" -loglevel error -y -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=440 -t 12 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart h264-1080.mp4
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -fsI http://127.0.0.1:8765/h264-1080.mp4 >/dev/null 2>&1 && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          "dist/CosmoGrav.app/Contents/MacOS/CosmoGrav" --selftest \
            "best::http://127.0.0.1:8765/vp9-4k.webm" \
            "best::http://127.0.0.1:8765/h264-1080.mp4" \
            "hd1080:2-7:http://127.0.0.1:8765/h264-1080.mp4" \
            "wav:0-5:http://127.0.0.1:8765/vp9-4k.webm" \
            "prores::http://127.0.0.1:8765/vp9-4k.webm" \
            "prores:3-8:http://127.0.0.1:8765/h264-1080.mp4" 2>&1 | tee dist/selftest.txt

      - name: Keep the screenshot on a "ci-preview" pre-release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f dist/screenshot.png ] || exit 0
          gh release view ci-preview >/dev/null 2>&1 || \
            gh release create ci-preview --prerelease --title "CI preview" --notes "Screenshots from automated test launches. Not for installing."
          gh release upload ci-preview dist/screenshot.png --clobber
          [ -f dist/screenshot-demo.png ] && gh release upload ci-preview dist/screenshot-demo.png --clobber
          [ -f dist/screenshot-about.png ] && gh release upload ci-preview dist/screenshot-about.png --clobber
          [ -f dist/screenshot-import.png ] && gh release upload ci-preview dist/screenshot-import.png --clobber
          [ -f dist/selftest-import.txt ] && gh release upload ci-preview dist/selftest-import.txt --clobber
          [ -f dist/screenshot-crawljob.png ] && gh release upload ci-preview dist/screenshot-crawljob.png --clobber
          [ -f dist/selftest-crawljob.txt ] && gh release upload ci-preview dist/selftest-crawljob.txt --clobber
          [ -f dist/selftest.txt ] && gh release upload ci-preview dist/selftest.txt --clobber

      - name: Publish release
        # Preview branches only build and photograph the app; releases come from main.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat app/VERSION)
          (cd dist && shasum -a 256 CosmoGrav.zip > CosmoGrav.zip.sha256)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/CosmoGrav.zip dist/CosmoGrav.zip.sha256 --clobber
          else
            gh release create "v$VERSION" dist/CosmoGrav.zip dist/CosmoGrav.zip.sha256 \
              --title "CosmoGrav $VERSION" \
              --notes "Install or update with the one-line command in the README." \
              --latest
          fi
